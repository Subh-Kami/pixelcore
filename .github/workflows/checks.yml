name: Circuit and trace checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  model-free-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Install pinned dependencies
        run: uv sync --locked
      - name: Model-free circuit and runtime checks
        run: uv run pytest tests/test_pixelcore.py tests/test_world.py tests/test_monitor.py tests/test_bridge.py -q
      - name: Verify published recordings
        run: uv run python scripts/verify_pixelcore_trace.py docs/results/full-qwen.json docs/results/standalone.json docs/results/manual-input.json
