[project]
name = "qgpu"
version = "0.1.0"
description = "A SIMT GPU that runs real CUDA, compiled into the weights of a stock Qwen3.5 model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "chipformer",
    "numpy>=1.26",
    "textual>=1.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
qgpu = "qgpu.tui:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
# Qwenputer's transformer compiler (MIT), used as a library
chipformer = { git = "https://github.com/divagr18/qwenputer", rev = "f07a0b2e38271454c4d455dc2b9bf78d3d399170" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qgpu"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
